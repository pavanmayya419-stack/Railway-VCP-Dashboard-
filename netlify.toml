[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/api/*"
  to = ":splat"
  status = 200

[functions]
  directory = "backend"
  node_bundler = "none"

[functions.python]
  runtime = "python3.11"
